<nav style="position: fixed; top: 0; left: 0; right: 0; z-index: 50; background-color: rgba(0, 0, 0, 0.55); background-image: url('/images/noise.png'); background-repeat: repeat; background-blend-mode: multiply;" class="px-4 md:px-10 lg:px-16 py-2 md:py-3 flex items-center justify-between">
  <a href="#" class="flex items-center gap-2 md:gap-3 text-bone hover:text-gold transition-colors group">
    <img
      src="/images/logo.png"
      alt="Velvet Pour"
      class="h-6 md:h-10 w-auto group-hover:opacity-90 transition-opacity"
      width="40"
      height="40"
    />
    <span class="font-modern text-2xl md:text-4xl leading-none">Velvet Pour</span>
  </a>

  <ul class="hidden md:flex items-center gap-10 text-sm font-medium tracking-wide">
    @for (link of links(); track link.href) {
      <li>
        <a
          [href]="link.href"
          class="text-bone/90 hover:text-gold transition-colors uppercase text-[13px]"
        >
          {{ link.label }}
        </a>
      </li>
    }
  </ul>

  <button
    type="button"
    class="md:hidden text-bone p-2 rounded hover:bg-white/5 transition-colors"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Abrir menú"
    (click)="toggleMenu()"
  >
    @if (!menuOpen()) {
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/>
      </svg>
    }
  </button>
</nav>

@if (menuOpen()) {
  <div
    class="fixed inset-0 z-40 bg-ink/95 backdrop-blur-md flex flex-col items-center justify-center gap-8 md:hidden"
    (click)="closeMenu()"
  >
    @for (link of links(); track link.href) {
      <a
        [href]="link.href"
        class="text-bone hover:text-gold text-2xl font-serif tracking-wide"
        (click)="closeMenu()"
      >
        {{ link.label }}
      </a>
    }
  </div>
}
