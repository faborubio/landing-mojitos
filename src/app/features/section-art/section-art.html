<section
  #sectionRoot
  id="arte"
  class="relative min-h-screen w-full mt-20 p-5 art-radial overflow-hidden"
>
  <img
    data-anim="side-drink"
    src="/images/drink1.png"
    alt=""
    aria-hidden="true"
    class="hidden md:block absolute left-2 lg:left-6 top-1/2 -translate-y-1/2 w-20 lg:w-28 xl:w-32 pointer-events-none select-none z-30 opacity-0"
  />
  <img
    data-anim="side-drink"
    src="/images/drink4.png"
    alt=""
    aria-hidden="true"
    class="hidden md:block absolute right-2 lg:right-6 top-1/2 -translate-y-1/2 w-20 lg:w-28 xl:w-32 pointer-events-none select-none z-30 opacity-0"
  />

  <div class="container mx-auto h-full pt-8 w-full relative">
    <h2
      data-anim="will-fade"
      class="relative md:text-[20vw] text-8xl text-nowrap leading-none font-modern text-center -mb-24 md:-mb-48 lg:-mb-64 z-0"
      style="color: #505050;"
    >
      El Arte
    </h2>

    <div class="content grid grid-cols-1 md:grid-cols-12 items-center gap-6 md:gap-4 relative z-10">
      <ul data-anim="will-fade" class="md:col-span-3 space-y-4 order-2 md:order-1">
        @for (item of goodList(); track item) {
          <li class="flex items-center gap-3">
            <img src="/images/check.png" alt="" class="w-5 h-5" />
            <p class="text-sm md:text-base text-bone">{{ item }}</p>
          </li>
        }
      </ul>

      <div class="cocktail-img md:col-span-6 order-1 md:order-2 relative w-full h-[45vh] md:h-[60vh] rounded-3xl overflow-hidden">
        <img
          data-anim="masked-img"
          src="/images/under-img.jpg"
          alt=""
          class="absolute inset-0 w-full h-full object-cover masked-img"
        />
      </div>

      <ul data-anim="will-fade" class="md:col-span-3 space-y-4 order-3">
        @for (item of featureList(); track item) {
          <li class="flex items-center gap-3">
            <img src="/images/check.png" alt="" class="w-5 h-5" />
            <p class="text-sm md:text-base text-bone md:w-fit w-60">{{ item }}</p>
          </li>
        }
      </ul>
    </div>

    <div class="masked-container relative text-center mt-10 min-h-[180px]">
      <h2
        data-anim="will-fade"
        class="font-modern text-gold text-5xl md:text-6xl"
      >
        Perfección en cada sorbo
      </h2>

      <div
        data-anim="masked-content"
        class="absolute inset-0 flex flex-col items-center justify-center opacity-0 px-4"
      >
        <h3 class="font-modern text-bone text-4xl md:text-5xl mb-3">
          Hecho con oficio, servido con pasión
        </h3>
        <p class="text-bone/85 text-base md:text-lg max-w-2xl mx-auto">
          Esto no es solo una bebida. Es un momento cuidadosamente creado solo
          para ti.
        </p>
      </div>
    </div>
  </div>
</section>
