<section
  #heroRoot
  id="hero"
  class="relative z-10 min-h-screen w-full"
>
  <h1
    data-anim="title"
    class="title font-modern text-bone text-[28vw] md:text-[20vw] leading-none text-center mt-32 md:mt-32 select-none"
    style="background: linear-gradient(180deg, #f5f1ea 0%, #8a8a8a 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;"
  >
    MOJITO
  </h1>

  <img
    data-anim="leaf-left"
    src="/images/hero-left-leaf.png"
    alt=""
    aria-hidden="true"
    class="left-leaf absolute left-0 md:top-20 xl:top-36 2xl:top-52 md:bottom-auto -bottom-20 w-1/3 md:w-[22vw] lg:w-[20vw] pointer-events-none select-none z-20"
  />

  <img
    data-anim="leaf-right"
    src="/images/hero-right-leaf.png"
    alt=""
    aria-hidden="true"
    class="right-leaf absolute right-0 md:top-24 xl:top-16 2xl:top-28 top-1/3 w-1/4 md:w-[20vw] lg:w-[18vw] pointer-events-none select-none z-20"
  />

  <div class="body container mx-auto absolute left-1/2 -translate-x-1/2 bottom-28 md:bottom-36 lg:bottom-44 flex justify-between items-end px-5 z-20">
    <div class="content flex lg:flex-row flex-col w-full gap-10 justify-between items-center lg:items-end mx-auto">
      <div data-anim="text-block" class="space-y-3 hidden md:block">
        <p class="text-bone/90 uppercase tracking-[0.3em] text-xs">
          Fresco · Crujiente · Clásico
        </p>
        <p class="font-modern text-gold text-4xl md:text-5xl leading-[1.05] max-w-xl">
          Saborea el Espíritu<br />del Verano
        </p>
      </div>

      <div data-anim="text-block" class="view-cocktails space-y-2 lg:max-w-sm md:max-w-xs w-full">
        <p class="text-bone text-xs md:text-sm leading-snug text-left">
          Cada cóctel de nuestra carta es una mezcla de ingredientes premium,
          creatividad artesanal y recetas atemporales — diseñados para deleitar
          tus sentidos.
        </p>
        <a
          href="#cocteles"
          class="font-semibold opacity-80 hover:text-gold text-bone text-xs uppercase tracking-wide inline-flex items-center gap-2"
        >
          Ver cócteles
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </div>
  </div>
</section>

<div class="video absolute inset-0 pointer-events-none">
  <video
    #heroVideo
    src="/videos/output.mp4"
    muted
    playsinline
    preload="auto"
    class="w-full md:h-screen h-1/2 absolute bottom-0 left-0 md:object-contain object-bottom object-cover"
    style="mix-blend-mode: screen; object-position: center bottom; -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 100%); mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 100%);"
    aria-hidden="true"
  ></video>
</div>
