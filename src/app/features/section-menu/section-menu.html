<section
  #sectionRoot
  id="menu"
  class="relative w-full min-h-screen overflow-hidden py-20"
  aria-labelledby="menu-heading"
>
  <img
    src="/images/slider-left-leaf.png"
    alt=""
    aria-hidden="true"
    class="absolute left-0 bottom-0 w-32 md:w-48 lg:w-60 pointer-events-none select-none z-10"
  />
  <img
    src="/images/slider-right-leaf.png"
    alt=""
    aria-hidden="true"
    class="absolute right-0 top-0 w-32 md:w-48 lg:w-60 pointer-events-none select-none z-10"
  />

  <h2 id="menu-heading" class="sr-only">Menú de Cócteles</h2>

  <nav
    aria-label="Navegación de cócteles"
    class="cocktail-tabs relative z-20 flex flex-wrap items-center justify-center gap-3 md:gap-12 mb-8 md:mb-12 px-5"
  >
    @for (cocktail of cocktails(); track cocktail.id; let i = $index) {
      <button
        type="button"
        (click)="goToSlide(i)"
        class="pb-1 border-b transition-colors font-modern text-base md:text-2xl"
        [class.text-bone]="i === currentIndex()"
        [class.border-bone]="i === currentIndex()"
        [class.text-bone\/50]="i !== currentIndex()"
        [class.border-bone\/50]="i !== currentIndex()"
      >
        {{ cocktail.name }}
      </button>
    }
  </nav>

  <div class="content relative z-20 grid grid-cols-1 md:grid-cols-3 items-center gap-6 md:gap-8 max-w-7xl mx-auto px-6 md:px-10">
    <button
      type="button"
      (click)="goToSlide(currentIndex() - 1)"
      class="hidden md:flex items-center gap-3 text-bone/80 hover:text-gold transition-colors text-left order-1"
      aria-label="Cóctel anterior"
    >
      <img src="/images/right-arrow.png" alt="" aria-hidden="true" class="w-6 h-6" />
      <span class="font-modern text-xl">{{ prev().name }}</span>
    </button>

    <div data-anim="cocktail-img" class="cocktail relative order-2 flex items-center justify-center min-h-[35vh] md:min-h-[55vh]">
      <img
        [src]="current().image"
        [alt]="current().name"
        class="object-contain max-h-[35vh] md:max-h-[55vh] w-auto mx-auto"
      />
    </div>

    <button
      type="button"
      (click)="goToSlide(currentIndex() + 1)"
      class="hidden md:flex items-center gap-3 text-bone/80 hover:text-gold transition-colors order-3 justify-end"
      aria-label="Siguiente cóctel"
    >
      <span class="font-modern text-xl">{{ next().name }}</span>
      <img src="/images/left-arrow.png" alt="" aria-hidden="true" class="w-6 h-6" />
    </button>
  </div>

  <div class="recipe relative z-20 grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-16 max-w-7xl mx-auto px-6 md:px-10 mt-8 md:mt-12">
    <div class="info text-left">
      <p class="text-bone/70 text-xs md:text-sm uppercase tracking-[0.25em] mb-2">Receta para:</p>
      <p
        data-anim="recipe-title"
        class="font-modern text-gold text-3xl md:text-5xl leading-tight"
      >
        {{ current().name }}
      </p>
    </div>

    <div class="details">
      <h3
        data-anim="details-text"
        class="font-modern text-bone text-2xl md:text-4xl mb-2 md:mb-3"
      >
        {{ current().title }}
      </h3>
      <p
        data-anim="details-text"
        class="text-bone/85 text-sm md:text-lg leading-relaxed"
      >
        {{ current().description }}
      </p>
    </div>
  </div>

  <div class="md:hidden flex items-center justify-center gap-8 mt-8">
    <button
      type="button"
      (click)="goToSlide(currentIndex() - 1)"
      class="p-3 rounded-full bg-bone/10 hover:bg-bone/20 transition-colors"
      aria-label="Cóctel anterior"
    >
      <img src="/images/right-arrow.png" alt="" aria-hidden="true" class="w-5 h-5" />
    </button>
    <button
      type="button"
      (click)="goToSlide(currentIndex() + 1)"
      class="p-3 rounded-full bg-bone/10 hover:bg-bone/20 transition-colors"
      aria-label="Siguiente cóctel"
    >
      <img src="/images/left-arrow.png" alt="" aria-hidden="true" class="w-5 h-5" />
    </button>
  </div>
</section>
